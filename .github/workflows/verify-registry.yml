name: Verify registry

on:
  pull_request:
    paths: ["registry/**", "log/**"]
  push:
    branches: [main]
    paths: ["registry/**", "log/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce append-only transparency log
        if: github.event_name == 'pull_request'
        run: |
          if git diff "origin/${GITHUB_BASE_REF}...HEAD" -- log/transparency.jsonl | grep -Eq '^-[^-]'; then
            echo "::error::transparency log lines were edited or removed — the log is append-only"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 scripts/verify_registry.py
